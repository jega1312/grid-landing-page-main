<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Grid landing page</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <!-- <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style> -->
  </head>
  <body>
    <nav
      class="bg-blue-700 w-full py-7 px-7 lg:px-14 flex justify-between items-center border-b border-blue-500 relative z-10"
    >
      <!-- Title -->
      <div class="flex gap-1 items-center">
        <div class="bg-white size-2 lg:size-3 rounded-full"></div>

        <h1 class="text-white font-inter text-sm lg:text-base">
          Bridge Collective
        </h1>
      </div>

      <!-- Navigation Logo -->
      <div class="cursor-pointer" id="nav-btn">
        <img
          src="./assets/images/icon-menu.svg"
          alt="icon-menu"
          class="size-6 lg:size-7 transition duration-300 ease-in-out"
          id="nav-img"
        />
      </div>
    </nav>

    <!-- Hero Section -->
    <div class="relative z-0 overflow-hidden">
      <aside
        class="lg:h-full w-full lg:max-w-[24%] bg-blue-700 absolute z-20 lg:right-0 hidden animate__animated animate__fadeInRight"
        id="nav-tab"
      >
        <ul class="flex flex-col gap-2 items-center lg:items-end px-14 py-14">
          <li
            class="font-inter text-center text-white text-2xl hover:underline transition duration-300 ease-in-out cursor-pointer"
          >
            About
          </li>
          <li
            class="font-inter text-center text-white text-2xl hover:underline transition duration-300 ease-in-out cursor-pointer"
          >
            Our Work
          </li>
          <li
            class="font-inter text-center text-white text-2xl hover:underline transition duration-300 ease-in-out cursor-pointer"
          >
            Partners
          </li>
          <li
            class="font-inter text-center text-white text-2xl hover:underline transition duration-300 ease-in-out cursor-pointer text-nowrap"
          >
            Annual Report
          </li>
          <li
            class="font-inter text-center text-white text-2xl hover:underline transition duration-300 ease-in-out cursor-pointer"
          >
            Donate
          </li>
        </ul>
      </aside>

      <div
        class="w-full h-full bg-black/50 absolute z-10 hidden"
        id="overlay"
      ></div>

      <main class="w-full bg-blue-700 flex flex-col lg:flex-row h-full">
        <!-- Left Content -->
        <div
          class="px-7 py-14 lg:py-0 lg:px-14 flex-1 flex flex-col justify-center gap-5 lg:gap-10 border-blue-500 border-y lg:border-x"
        >
          <h1 class="font-inter text-white text-4xl lg:text-6xl">
            A classroom <br class="hidden lg:block" />
            for every child.
          </h1>
          <p class="font-inter text-white/75 w-full lg:w-[60%] text-base">
            We fund the schools, train the teachers, and measure what works — so
            every child we reach today becomes a graduate tomorrow.
          </p>
        </div>
        <!-- Right Content -->
        <div class="flex-1 h-full">
          <div
            class="grid grid-cols-1 lg:grid-cols-2 h-full"
            id="stats-box"
          ></div>
        </div>
      </main>
      <footer
        class="bg-blue-700 w-full py-7 px-7 lg:px-14 flex lg:flex-row flex-col justify-between items-start lg:items-center border-t border-blue-500"
      >
        <!-- Title -->
        <p class="text-white font-inter text-sm">© 2026 Bridge Collective</p>
        <!-- Navigation Logo -->
        <p class="text-white font-inter text-sm">Registered charity 12345678</p>
      </footer>
    </div>

    <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </div> -->

    <script src="script.js"></script>
  </body>
</html>
